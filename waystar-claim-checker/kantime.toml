[application]
entrypoint = "waystar_claim_checker.application:create_application"
package = "waystar_claim_checker"
source_dir = "src"

[build]
entry_script = "src/waystar_claim_checker/__main__.py"
executable_name = "Waystar Claim Checker"
hidden_imports = []
icon = "src/waystar_claim_checker/assets/waystar.ico"
data = [{source = "src/waystar_claim_checker/assets", destination = "waystar_claim_checker/assets"}]
