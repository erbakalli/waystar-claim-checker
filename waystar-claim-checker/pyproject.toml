[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "waystar-claim-checker"
version = "0.1.0"
description = "Waystar Medicare claims checker for receivables aging workbooks"
requires-python = ">=3.11,<3.15"
dependencies = ["kantime-engine==2.0.0"]

[project.optional-dependencies]
build = ["pyinstaller==6.22.3"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
